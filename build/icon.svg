<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- CullPrint uygulama ikonu: yazıcıdan çıkan fotoğraf + "basıldı" onayı. PNG'ler: scripts/make-icons.sh -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fca5a5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1e1b4b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- Fotoğraf baskısı (yazıcıdan çıkıyor) -->
  <g filter="url(#shadow)">
    <rect x="282" y="150" width="460" height="560" rx="26" fill="#ffffff"/>
  </g>
  <clipPath id="photo">
    <rect x="322" y="190" width="380" height="440" rx="10"/>
  </clipPath>
  <g clip-path="url(#photo)">
    <rect x="322" y="190" width="380" height="440" fill="url(#sky)"/>
    <circle cx="600" cy="300" r="56" fill="#fffbeb"/>
    <path d="M300 640 L440 420 L520 520 L590 450 L730 640 Z" fill="#4f46e5"/>
    <path d="M300 640 L440 420 L480 480 L400 640 Z" fill="#3730a3"/>
  </g>

  <!-- Yazıcı gövdesi ve kâğıt yuvası -->
  <rect x="172" y="620" width="680" height="232" rx="64" fill="#1e1b4b"/>
  <rect x="242" y="672" width="540" height="30" rx="15" fill="#0b0a24"/>
  <circle cx="742" cy="782" r="18" fill="#34d399"/>

  <!-- Basıldı onayı -->
  <g filter="url(#shadow)">
    <circle cx="748" cy="200" r="104" fill="#22c55e"/>
  </g>
  <path d="M700 202 L735 238 L800 166" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
